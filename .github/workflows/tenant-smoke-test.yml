name: Tenant smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tenant-smoke-test:
    name: Read-only tenant connectivity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate local package
        run: npm run validate

      - name: Azure login with GitHub OIDC
        uses: azure/login@v2
        with:
          tenant-id: f24e5cef-e4a8-409f-b11b-51e4f40467c1
          client-id: 04e23119-3ed3-4bf8-bf5b-2f76071a2de5
          allow-no-subscriptions: true

      - name: Read-only Graph smoke test
        env:
          TENANT_ID: f24e5cef-e4a8-409f-b11b-51e4f40467c1
          EXPECTED_TEST_USER_UPN: ${{ secrets.TEST_USER_UPN }}
          DEPLOYED_SITE_ID: m365cpi16380285.sharepoint.com,fe9c2bf8-f429-4fc9-af4f-b2356d8e5e30,f387fb96-2323-406c-871b-df4a5aea1053
          DEPLOYED_LIST_ID: 80878f5a-df44-467f-8509-9260a4a2e74e
        run: pwsh -File scripts/test-tenant-access.ps1
